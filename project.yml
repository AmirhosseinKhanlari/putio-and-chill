name: AMDB
options:
  bundleIdPrefix: app.amdb
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Developer team used to sign every target (app, widget, TV app) for Debug and Release.
    DEVELOPMENT_TEAM: 8CG9QYMSR5
    MARKETING_VERSION: "1.0"
    # Build number for uploads: raise it for every TestFlight/App Store upload.
    CURRENT_PROJECT_VERSION: "14"
packages:
  AMDBCore:
    path: AMDBCore
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  AMDB:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - AMDBUITests
    sources:
      - path: App/iOS
      - path: App/Shared
      - path: App/SharedUI
    entitlements:
      path: App/iOS/AMDB.entitlements
      properties:
        com.apple.security.application-groups: [group.app.amdb]
    dependencies:
      - package: AMDBCore
        product: AMDBCore
      - package: AMDBCore
        product: AMDBKit
      - target: AMDBWidgets
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Putio & Chill
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.amdb.oauth
            CFBundleURLSchemes: [amdb]
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [app.amdb.refresh]
        UIUserInterfaceStyle: Dark
        TMDBReadToken: $(TMDB_READ_TOKEN)
        TraktClientID: $(TRAKT_CLIENT_ID)
        OpenSubtitlesAPIKey: $(OPENSUBTITLES_API_KEY)
        NSSupportsLiveActivities: true
        # Only standard HTTPS: exempt from export compliance, so TestFlight builds don't wait on the question.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amdb.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  AMDBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: AMDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  AMDBWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Shared
    entitlements:
      path: App/Widgets/AMDBWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.amdb]
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Putio & Chill
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amdb.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  AMDBTV:
    type: application
    platform: tvOS
    scheme:
      testTargets:
        - AMDBTVUITests
    sources:
      - path: App/tvOS
      - path: App/SharedUI
      - path: App/TVShared
    dependencies:
      - package: AMDBCore
        product: AMDBCore
      - package: AMDBCore
        product: AMDBKit
      - target: AMDBTopShelf
    entitlements:
      path: App/tvOS/AMDBTV.entitlements
      properties:
        com.apple.security.application-groups: [group.app.amdb]
    info:
      path: App/tvOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.amdb
            CFBundleURLSchemes: [amdb]
        CFBundleDisplayName: Putio & Chill
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        TMDBReadToken: $(TMDB_READ_TOKEN)
        TraktClientID: $(TRAKT_CLIENT_ID)
        OpenSubtitlesAPIKey: $(OPENSUBTITLES_API_KEY)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Same bundle id as the iPhone/iPad app: one App Store listing (universal purchase), and keys saved
        # in iCloud Keychain on the iPhone show up on the TV.
        PRODUCT_BUNDLE_IDENTIFIER: app.amdb.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  AMDBTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: App/TopShelf
      - path: App/TVShared
    entitlements:
      path: App/TopShelf/AMDBTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.app.amdb]
    info:
      path: App/TopShelf/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Putio & Chill Top Shelf
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amdb.ios.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  AMDBTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: App/TVUITests
    dependencies:
      - target: AMDBTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"
