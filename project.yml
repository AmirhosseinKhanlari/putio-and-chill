name: AMDB
options:
  bundleIdPrefix: app.amdb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AMDBCore:
    path: AMDBCore
targets:
  AMDB:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
    dependencies:
      - package: AMDBCore
        product: AMDBCore
      - package: AMDBCore
        product: AMDBKit
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: AMDB
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.amdb.oauth
            CFBundleURLSchemes: [amdb]
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [app.amdb.refresh]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.amdb.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
